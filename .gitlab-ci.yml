# CI for auto/jorderbook — JUnit on every commit
stages:
  - test

test:
  stage: test
  tags:
    - amd64
  # registry.gitlab.7desl.com is not resolvable from runner host daemons (dind-only);
  # use the public JDK image, gradle comes via the wrapper + cache
  image: eclipse-temurin:25-jdk
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/wrapper
      - .gradle/caches
    policy: pull-push
  script:
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: always